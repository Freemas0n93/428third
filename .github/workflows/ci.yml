name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (headless Chromium renders the building)
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:4173/space || echo "::error title=preview::vite preview not serving: $(tail -c 300 preview.log | tr '\n' ' ')"
          node scripts/smoke.mjs http://127.0.0.1:4173 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then echo "::error title=smoke-tail::$(tail -c 900 smoke.log | tr '\n' ' ')"; fi
          exit $code
